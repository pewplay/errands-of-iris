<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Errands of Iris</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
  }
  body {
    position: relative;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    /* size set from JS (letterboxed to the window, see game.js onresize) */
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    touch-action: none;
    outline: none;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script src="game.js"></script>
</body>
</html>
